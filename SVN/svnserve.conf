[general]
# Enable anonymous read access for templates
anon-access = read
# Require authentication for write access
auth-access = write
# Password database
password-db = /etc/subversion/passwd
# Authorization rules
authz-db = /etc/subversion/authz
# Realm name
realm = AutoMark SVN Repository

[sasl]
# Disable SASL for simplicity
use-sasl = false

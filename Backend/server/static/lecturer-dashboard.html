<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AutoMark — Lecturer Dashboard</title>
  <link rel="stylesheet" type="text/css" href="/css/pages/lecturer-dashboard.css" /> 
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">📚 AutoMark</div>
      <div>
        <h1>Lecturer Dashboard</h1>
        <div class="small">Manage your subjects and assignments</div>
      </div>
    </div>
    <div class="controls">
      <div class="small" id="lecturerName">Welcome</div>
      <button id="logoutBtn" class="ghost">Sign out</button>
    </div>
  </header>

  <!-- Stats Section -->
  <div class="stats">
    <div class="stat">
      <div class="number" id="totalFolders">0</div>
      <div class="label">Total Assignments</div>
    </div>
    <div class="stat">
      <div class="number" id="totalStudents">0</div>
      <div class="label">Students</div>
    </div>
    <div class="stat">
      <div class="number" id="totalSubmissions">0</div>
      <div class="label">Submissions</div>
    </div>
  </div>

  <div class="layout">
    <!-- LEFT PANEL -->
    <aside class="panel">
      <h4 style="margin:6px 0">Quick Actions</h4>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button id="createAssignmentBtn">Create New Assignment</button>
        <button id="showAllSubs" class="ghost">View All Submissions</button>
        <button id="refreshBtn" class="ghost">Refresh Subjects</button>
      </div>
    </aside>

    <!-- RIGHT PANEL -->
    <main class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3 style="margin:0">My Subjects & Assignments</h3>
        <div style="display:flex;gap:8px;align-items:center">
          <button id="expandAllBtn" class="toggle-btn">Expand All</button>
          <button id="collapseAllBtn" class="toggle-btn">Collapse All</button>
        </div>
      </div>
      
      <div class="small">Your assigned subjects appear as folders. Click to expand and manage assignments.</div>
      <div class="list" id="folderList" style="margin-top:12px"></div>
      
      <!-- Submissions View -->
      <div id="subViewer" style="display:none;margin-top:20px;border-top:2px solid #eee;padding-top:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <h4 style="margin:0">Submissions for <span id="subViewerFolderName"></span></h4>
          <div style="display:flex;gap:8px">
            <button id="downloadAllSubs" class="success">Download All</button>
            <button id="closeSubs" class="ghost">Close</button>
          </div>
        </div>
        <div class="submission-list" id="submissionsContainer"></div>
      </div>
    </main>
  </div>

  <!-- Create Assignment Modal -->
  <div id="createAssignmentModal" style="display:none;" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Create New Assignment</h2>
        <span class="close">&times;</span>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="assignmentSubject">Subject</label>
          <select id="assignmentSubject">
            <option value="">Select Subject</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="assignmentName">Assignment Name</label>
          <input type="text" id="assignmentName" placeholder="Enter assignment name">
        </div>
        
        <div class="form-group">
          <label for="assignmentDescription">Description</label>
          <textarea id="assignmentDescription" placeholder="Enter assignment description"></textarea>
        </div>
        
        <div class="form-group">
          <label for="assignmentDueDate">Due Date</label>
          <input type="datetime-local" id="assignmentDueDate">
        </div>
        
        <div class="form-group">
          <label for="assignmentMaxPoints">Maximum Points</label>
          <input type="number" id="assignmentMaxPoints" value="100" min="0">
        </div>
        
        <div class="form-group">
          <label for="assignmentStatus">Status</label>
          <select id="assignmentStatus">
            <option value="draft">Draft</option>
            <option value="published">Published</option>
            <option value="closed">Closed</option>
          </select>
        </div>
        
        <div class="form-group">
          <input type="text" id="assignmentStudentSearch" placeholder="Search students..." oninput="filterStudents()">
          
          <div class="student-list" id="assignmentStudentList">
            <!-- Student checkboxes will be inserted here -->
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button id="cancelAssignmentBtn" class="ghost">Cancel</button>
        <button id="saveAssignmentBtn" class="success">Create Assignment</button>
      </div>
    </div>
  </div>

  <!-- Notification -->
  <div id="notification" class="notification"></div>

  <script type="module" src="/js/pages/lecturer-dashboard.js"></script>
</body>
</html>

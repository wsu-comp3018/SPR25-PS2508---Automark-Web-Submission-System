<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AutoMark - User List</title>
  <link rel="stylesheet" type="text/css" href="/css/pages/databaseview.css" /> 
  
</head>
<body>
  <h1>Registered Users</h1>
  <table id="userTable">
    <thead>
      <tr>
        <th><input type="checkbox" id="selectAll" /></th>
        <th>No.</th>
        <th>Username</th>
        <th>Email</th>
        <th>Role</th>
        <th>Full Name</th>
        <th>Status</th>
        <th>Created At</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>

  <button class="danger-button" onclick="deleteSelectedUsers()">Delete Selected Users</button>
  <button class="danger-button" onclick="resetDatabase()">Delete All Users</button>

<script type="module" src="/js/pages/databaseview.js"></script>
</body>
</html>

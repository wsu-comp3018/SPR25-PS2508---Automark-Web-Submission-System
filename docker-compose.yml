# (you can remove the 'version:' line to silence the compose warning)
services:
  # FastAPI Backend Server
  automark-api:
    build:
      context: ./Backend/server
      dockerfile: Dockerfile
    container_name: automark-api
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=/app/data/automark.db
      - UPLOAD_DIR=/app/uploads
      - PYTHONPATH=/app
      - SANDBOX_IMAGE=automark-sandbox:latest        # <-- added
    volumes:
      - automark-data:/app/data
      - automark-uploads:/app/uploads
      - ./Backend/server:/app
      - /var/run/docker.sock:/var/run/docker.sock    # <-- added (lets API run containers)
    networks:
      - automark-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # SSH Server for Assignment Submissions
    # SSH Server for Assignment Submissions
  automark-ssh:
    build:
      context: ./Backend/docker
    container_name: automark-ssh
    ports:
      - "2222:22"
    volumes:
      - automark-submissions:/home
      - automark-submissions:/shared/submissions:ro
    networks:
      - automark-network
    restart: unless-stopped
    environment:
      - TZ=Australia/Sydney
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x sshd >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Web Server for Frontend (optional - for production)
  automark-web:
    image: nginx:alpine
    container_name: automark-web
    ports:
      - "3000:80"
    volumes:
      - ./Frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - automark-network
    restart: unless-stopped
    depends_on:
      - automark-api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Sandbox image (built once, run on demand by API)  <-- added
  automark-sandbox:
    build:
      context: ./Backend/sandbox
      dockerfile: Dockerfile
    image: automark-sandbox:latest
    networks:
      - automark-network
    restart: "no"

volumes:
  automark-data:
    driver: local
  automark-uploads:
    driver: local
  automark-submissions:
    driver: local

networks:
  automark-network:
    driver: bridge

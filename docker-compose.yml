version: '3.8'

services:
  # FastAPI Backend Server
  automark-api:
    build:
      context: ./Backend/server
      dockerfile: Dockerfile
    container_name: automark-api
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=/app/data/automark.db
      - UPLOAD_DIR=/app/uploads
      - PYTHONPATH=/app
    volumes:
      # Persist database and uploads
      - automark-data:/app/data
      - automark-uploads:/app/uploads
      # Mount source code for development (hot reload)
      - ./Backend/server:/app
      # Mount Docker socket for SSH user management
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared access to SSH submissions (READ/WRITE)
      - automark-submissions:/app/shared/submissions
    networks:
      - automark-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # SSH Server for Assignment Submissions
  automark-ssh:
    build:
      context: ./Backend/docker
      dockerfile: Dockerfile
    container_name: automark-ssh
    ports:
      - "2222:22"
    volumes:
      # Persist student submissions
      - automark-submissions:/home
    networks:
      - automark-network
    restart: unless-stopped
    environment:
      - TZ=Australia/Sydney
    healthcheck:
      test: ["CMD", "systemctl", "is-active", "ssh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # SVN Server for Assignment Templates and Submission Collection
  automark-svn:
    build:
      context: ./SVN
      dockerfile: Dockerfile
    container_name: automark-svn
    ports:
      - "3690:3690"  # SVN protocol port
    volumes:
      # SVN repositories
      - automark-svn-repos:/var/svn
      # Shared access to collect submissions
      - automark-submissions:/var/submissions
    networks:
      - automark-network
    restart: unless-stopped
    environment:
      - TZ=Australia/Sydney
    healthcheck:
      test: ["CMD", "svnserve", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Web Server for Frontend (optional - for production)
  automark-web:
    image: nginx:alpine
    container_name: automark-web
    ports:
      - "3000:80"
    volumes:
      - ./Backend/server/static:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - automark-network
    restart: unless-stopped
    depends_on:
      - automark-api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  # Persistent storage for database and files
  automark-data:
    driver: local
  automark-uploads:
    driver: local
  automark-submissions:
    driver: local
  automark-svn-repos:
    driver: local

networks:
  automark-network:
    driver: bridge

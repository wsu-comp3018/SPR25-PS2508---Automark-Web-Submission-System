<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AutoMark - User List</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 30px;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
      overflow-x: auto;
    }

    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #e0e0e0;
    }

    th {
      background-color: #667eea;
      color: white;
    }

    tr:hover {
      background-color: #f1f3f5;
    }

    .status-active {
      color: green;
      font-weight: bold;
    }

    .status-inactive {
      color: red;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      th, td {
        font-size: 14px;
        padding: 8px;
      }
    }

    .danger-button {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      border: none;
      color: white;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 30px;
      box-shadow: 0 4px 12px rgba(231, 76, 60, 0.4);
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .danger-button:hover {
      background: linear-gradient(135deg, #c0392b, #a93226);
      transform: scale(1.03);
      box-shadow: 0 6px 18px rgba(192, 57, 43, 0.5);
    }

    .danger-button:active {
      transform: scale(0.97);
      box-shadow: 0 2px 8px rgba(192, 57, 43, 0.3);
    }
  </style>
</head>
<body>
  <h1>Registered Users</h1>
  <table id="userTable">
    <thead>
      <tr>
        <th><input type="checkbox" id="selectAll" /></th>
        <th>No.</th>
        <th>Username</th>
        <th>Email</th>
        <th>Role</th>
        <th>Full Name</th>
        <th>Status</th>
        <th>Created At</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>

  <button class="danger-button" onclick="deleteSelectedUsers()">Delete Selected Users</button>
  <button class="danger-button" onclick="resetDatabase()">Delete All Users</button>

  <script>
    const users = JSON.parse(localStorage.getItem('automark_users')) || [];
    const tableBody = document.querySelector('#userTable tbody');

    function renderUsers() {
      tableBody.innerHTML = "";

      if (users.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:#999;">No users found.</td></tr>`;
        return;
      }

      users.forEach((user, index) => {
        const row = document.createElement('tr');

        row.innerHTML = `
          <td><input type="checkbox" class="user-checkbox" data-index="${index}"></td>
          <td>${index + 1}</td>
          <td>${user.username}</td>
          <td>${user.email}</td>
          <td>${user.role}</td>
          <td>${user.firstName} ${user.lastName}</td>
          <td class="${user.isActive ? 'status-active' : 'status-inactive'}">
            ${user.isActive ? 'Active' : 'Inactive'}
          </td>
          <td>${new Date(user.createdAt).toLocaleString()}</td>
        `;

        tableBody.appendChild(row);
      });
    }

    function deleteSelectedUsers() {
      const checkboxes = document.querySelectorAll('.user-checkbox:checked');
      if (checkboxes.length === 0) {
        alert("Please select at least one user to delete.");
        return;
      }

      if (!confirm("Are you sure you want to delete selected users? This action cannot be undone.")) {
        return;
      }

      const indexesToDelete = Array.from(checkboxes).map(cb => parseInt(cb.dataset.index));
      indexesToDelete.sort((a, b) => b - a); 

      indexesToDelete.forEach(i => {
        users.splice(i, 1);
      });

      localStorage.setItem('automark_users', JSON.stringify(users));
      renderUsers();
    }

    function resetDatabase() {
      if (confirm("Are you sure you want to delete ALL AutoMark data? This action cannot be undone.")) {
        localStorage.removeItem('automark_users');
        localStorage.removeItem('automark_sessions');
        localStorage.removeItem('automark_token');
        localStorage.removeItem('automark_user');
        localStorage.removeItem('automark_login_time');
        localStorage.removeItem('automark_last_username');
        alert("All database records deleted.");
        location.reload();
      }
    }


    document.getElementById('selectAll').addEventListener('change', function () {
      const checkboxes = document.querySelectorAll('.user-checkbox');
      checkboxes.forEach(cb => cb.checked = this.checked);
    });

    renderUsers();
  </script>
</body>
</html>
